    function ensureMainAdminIntegrity(usersArr) {
      const list = Array.isArray(usersArr) ? [...usersArr] : [];
      const idx = list.findIndex(u => u.role === 'MAIN_ADMIN' || u.id === MAIN_ADMIN_DEFAULT.id);
      if (idx === -1) {
        list.unshift({ ...MAIN_ADMIN_DEFAULT });
      } else {
        list[idx] = {
          ...MAIN_ADMIN_DEFAULT,
          ...list[idx],
          id: MAIN_ADMIN_DEFAULT.id,
          role: 'MAIN_ADMIN',
          active: true
        };
      }
      return list;
    }

    function migrateState(raw) {
      const base = createInitialState();
      if (!raw || typeof raw !== 'object') return base;

      const goals = Array.isArray(raw.goals) && raw.goals.length
        ? raw.goals.map((g, i) => ({
            id: g.id || `GOAL-${String(i + 1).padStart(2, '0')}`,
            title: g.title || `উদ্দেশ্য ${i + 1}`,
            description: g.description || ''
          }))
        : (Array.isArray(raw.visionMission?.objectives) && raw.visionMission.objectives.length
            ? raw.visionMission.objectives.map((txt, i) => ({
                id: `GOAL-${String(i + 1).padStart(2, '0')}`,
                title: `সমবায় লক্ষ্য ও উদ্দেশ্য #${toBengaliDigits(i + 1)}`,
                description: typeof txt === 'string' ? txt : (txt.description || '')
              }))
            : base.goals);

      const channels = Array.isArray(raw.paymentChannels) && raw.paymentChannels.length
        ? raw.paymentChannels
        : base.paymentChannels;

      const users = ensureMainAdminIntegrity(
        Array.isArray(raw.users) && raw.users.length
          ? raw.users.map(u => ({
              ...u,
              designation: u.designation || (u.role === 'MAIN_ADMIN' ? 'প্রধান অ্যাডমিন ও সভাপতি' : u.role === 'ADMIN' ? 'কার্যনির্বাহী অ্যাডমিন' : 'সমবায় সদস্য'),
              monthlyTarget: Number(u.monthlyTarget) || 500,
              initialShare: Number(u.initialShare) || 0,
              active: u.role === 'MAIN_ADMIN' ? true : (u.active !== false)
            }))
          : base.users
      );

      return {
        ...base,
        ...raw,
        goals,
        goalsMeta: {
          ...base.goalsMeta,
          ...(raw.goalsMeta || {}),
          ...(raw.visionMission ? {
            updatedAt: raw.visionMission.updatedAt || base.goalsMeta.updatedAt,
            updatedBy: raw.visionMission.updatedBy || base.goalsMeta.updatedBy
          } : {})
        },
        lateFeeRule: {
          ...base.lateFeeRule,
          ...(raw.lateFeeRule || {})
        },
        paymentChannels: channels,
        users,
        savings: Array.isArray(raw.savings) ? raw.savings : base.savings,
        loans: Array.isArray(raw.loans) ? raw.loans : base.loans,
        installments: Array.isArray(raw.installments) ? raw.installments : base.installments,
        transactions: Array.isArray(raw.transactions) ? raw.transactions : base.transactions,
        notices: Array.isArray(raw.notices) ? raw.notices : base.notices,
        auditLogs: Array.isArray(raw.auditLogs) ? raw.auditLogs : base.auditLogs
      };
    }

    function loadState() {
      try {
        const rawStr = localStorage.getItem(STORAGE_KEY);
        if (rawStr) {
          return migrateState(JSON.parse(rawStr));
        }
        for (const legacyKey of LEGACY_KEYS) {
          const legacyStr = localStorage.getItem(legacyKey);
          if (legacyStr) {
            const migrated = migrateState(JSON.parse(legacyStr));
            localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
            return migrated;
          }
        }
      } catch (err) {
        console.error('Error loading state:', err);
      }
      const fresh = createInitialState();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
      } catch (_) {}
      return fresh;
    }

    function saveState() {
      try {
        state.users = ensureMainAdminIntegrity(state.users);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('Error saving state:', err);
        showToast('ব্রাউজার স্টোরেজে সংরক্ষণ করতে সমস্যা হয়েছে। ব্যাকআপ নিন।', 'error');
      }
    }

    // ২. ইউটিলিটি, বাংলা সংখ্যা, মুদ্রা ও অডিট হেল্পার
    // =========================================================================
    const BN_DIGITS = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];

    function toBengaliDigits(val) {
      return String(val ?? '').replace(/\d/g, d => BN_DIGITS[Number(d)]);
    }

    function normalizeMobile(raw) {
      const enDigits = String(raw ?? '').replace(/[০-৯]/g, d => String(BN_DIGITS.indexOf(d)));
      return enDigits.replace(/[^\d]/g, '');
    }

    function formatBDT(num) {
      const n = Number(num) || 0;
      const absStr = Math.abs(Math.round(n)).toLocaleString('en-US');
      const prefix = n < 0 ? '-' : '';
      return `${prefix}৳${toBengaliDigits(absStr)}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getCurrentUser() {
      if (!state.currentUserId) return null;
      return state.users.find(u => u.id === state.currentUserId) || null;
    }

    function isAdmin(user = getCurrentUser()) {
      return Boolean(user && (user.role === 'MAIN_ADMIN' || user.role === 'ADMIN'));
    }

    function isMainAdmin(user = getCurrentUser()) {
      return Boolean(user && user.role === 'MAIN_ADMIN');
    }

    function getRoleLabel(role) {
      if (role === 'MAIN_ADMIN') return 'প্রধান অ্যাডমিন';
      if (role === 'ADMIN') return 'অ্যাডমিন';
      return 'সদস্য';
    }

      }
      if (role === 'ADMIN') {

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const styles = {
        success: 'bg-emerald-900 text-white border-emerald-700',
        error: 'bg-rose-900 text-white border-rose-700',
        warning: 'bg-amber-900 text-white border-amber-700',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      const icons = {
        success: '✓',
        error: '✕',
        warning: '!',
        info: 'i'
      };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-2xl border shadow-xl text-sm font-medium transition-all duration-200 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="w-5 h-5 shrink-0 rounded-full bg-white/15 flex items-center justify-center text-xs font-bold mt-0.5">${icons[type] || 'i'}</span>
        <span class="flex-1 leading-snug">${escapeHtml(message)}</span>
      `;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 220);
      }, 3600);
    }

    function copyTextToClipboard(text, successMsg = 'কপি করা হয়েছে!') {
      const value = String(text ?? '');
      try {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(value).catch(() => {});
        }
        const ta = document.createElement('textarea');
        ta.value = value;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(successMsg, 'success');
      } catch (_) {
        showToast('কপি করা সম্ভব হয়নি।', 'error');
      }
    }

    // =========================================================================
    // ৩. মডাল ও প্রিন্ট হেল্পার
    // =========================================================================
    let modalButtonsCallbacks = [];

    function openModal(title, bodyHtml, buttons = []) {
      const backdrop = document.getElementById('modalBackdrop');
      const titleEl = document.getElementById('modalTitle');
      const bodyEl = document.getElementById('modalBody');
      const footerEl = document.getElementById('modalFooter');
      if (!backdrop || !titleEl || !bodyEl || !footerEl) return;

      titleEl.textContent = title;
      bodyEl.innerHTML = bodyHtml;
      modalButtonsCallbacks = buttons.map(b => b.onClick || null);

      if (buttons.length) {
        footerEl.classList.remove('hidden');
        footerEl.innerHTML = buttons.map((btn, idx) => `
          <button type="button" onclick="triggerModalButton(${idx})" class="${btn.className || 'px-4 py-2 rounded-xl bg-slate-200 text-slate-800 text-sm font-bold cursor-pointer'}">
            ${escapeHtml(btn.label)}
          </button>
        `).join('');
      } else {
        footerEl.classList.add('hidden');
        footerEl.innerHTML = '';
      }

      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function triggerModalButton(idx) {
      const fn = modalButtonsCallbacks[idx];
      if (typeof fn === 'function') fn();
    }

    function closeModal() {
      const backdrop = document.getElementById('modalBackdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      modalButtonsCallbacks = [];
    }

    function handleBackdropClick(e) {
      if (e.target && e.target.id === 'modalBackdrop') {
        closeModal();
      }
    }

      if (!printArea) return;

      printArea.classList.remove('hidden');

    // ৪. আর্থিক হিসাব, যোগ্যতা ও জরিমানা ক্যালকুলেশন
    // =========================================================================
    function getMemberSavingsTotal(memberId) {
      const user = state.users.find(u => u.id === memberId);
      const initial = Number(user?.initialShare) || 0;
      const collected = state.savings
        .filter(s => s.memberId === memberId)
        .reduce((sum, s) => sum + (Number(s.amount) || 0), 0);
      return initial + collected;
    }

    function getMemberLoanSummary(memberId) {
      const memberLoans = state.loans.filter(l => l.memberId === memberId);
      const activeLoans = memberLoans.filter(l => l.status === 'APPROVED');
      const totalRemaining = activeLoans.reduce((sum, l) => sum + (Number(l.remainingAmount) || 0), 0);
      const totalPrincipal = memberLoans
        .filter(l => l.status === 'APPROVED' || l.status === 'COMPLETED')
        .reduce((sum, l) => sum + (Number(l.principal) || 0), 0);
      return {
        allCount: memberLoans.length,
        activeCount: activeLoans.length,
        totalRemaining,
        totalPrincipal
      };
    }

    function calculateLoanEligibility(memberId) {
      const savings = getMemberSavingsTotal(memberId);
      const loanSum = getMemberLoanSummary(memberId);
      // সঞ্চয়ের সর্বোচ্চ ৩ গুণ পর্যন্ত যোগ্যতা (ন্যূনতম ৫,০০০ টাকা ভিত্তি), চলমান বকেয়া বাদ দিয়ে
      const grossLimit = Math.max(5000, savings * 3);
      const netEligible = Math.max(0, grossLimit - loanSum.totalRemaining);
      return {
        savings,
        grossLimit,
        existingDebt: loanSum.totalRemaining,
        netEligible
      };
    }

    function calculateSuggestedLateFee(dueDateStr) {
      const rule = state.lateFeeRule || { graceDays: 5, dailyFee: 20, maxFee: 500, enabled: true };
      if (!rule.enabled || !dueDateStr) return 0;
      const due = new Date(dueDateStr + 'T00:00:00');
      const now = new Date();
      const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (isNaN(due.getTime())) return 0;
      const diffDays = Math.floor((todayMidnight - due) / (1000 * 60 * 60 * 24));
      const overdueDays = diffDays - (Number(rule.graceDays) || 0);
      if (overdueDays <= 0) return 0;
      const rawFee = overdueDays * (Number(rule.dailyFee) || 0);
      return Math.min(Number(rule.maxFee) || 500, rawFee);
    }

    function getFinancialTotals() {
      const totalSavings = state.users.reduce((s, u) => s + (Number(u.initialShare) || 0), 0)
        + state.savings.reduce((s, x) => s + (Number(x.amount) || 0), 0);

      const totalInstallmentsPaid = state.installments.reduce((s, x) => s + (Number(x.totalPaid) || 0), 0);

      const totalIncome = state.transactions
        .filter(t => t.type === 'INCOME')
        .reduce((s, x) => s + (Number(x.amount) || 0), 0);

      const totalExpense = state.transactions
        .filter(t => t.type === 'EXPENSE')
        .reduce((s, x) => s + (Number(x.amount) || 0), 0);

      const activeLoanDisbursed = state.loans
        .filter(l => l.status === 'APPROVED' || l.status === 'COMPLETED')
        .reduce((s, x) => s + (Number(x.principal) || 0), 0);

      const activeLoanRemaining = state.loans
        .filter(l => l.status === 'APPROVED')
        .reduce((s, x) => s + (Number(x.remainingAmount) || 0), 0);

      const pendingLoansCount = state.loans.filter(l => l.status === 'PENDING').length;

      // সমিতির হাতে থাকা আনুমানিক নগদ/তহবিল (আয় - ব্যয়)
      const netCashBalance = totalIncome - totalExpense;

      return {
        totalSavings,
        totalInstallmentsPaid,
        totalIncome,
        totalExpense,
        netCashBalance,
        activeLoanDisbursed,
        activeLoanRemaining,
        pendingLoansCount
      };
    }

    function syncLedgerTransaction({ type, category, title, amount, method, reference, date, recordedBy }) {

      state.transactions.unshift({

        reference: reference || '',
        date: date || getTodayISO(),
        recordedBy: recordedBy || (getCurrentUser()?.name || 'অ্যাডমিন')
      });
    }

      e.preventDefault();
      const fd = new FormData(e.target);
      const mobile = normalizeMobile(fd.get('mobile'));
      const password = String(fd.get('password') || '');

      if (!mobile || !password) {

      if (!user) {
        showToast('ভুল মোবাইল নম্বর অথবা পাসওয়ার্ড। পুনরায় চেষ্টা করুন।', 'error');
        return;

      if (user.active === false && user.role !== 'MAIN_ADMIN') {
        showToast('আপনার অ্যাকাউন্টটি বর্তমানে নিষ্ক্রিয় রয়েছে। অ্যাডমিনের সাথে যোগাযোগ করুন।', 'error');
        return;
      }

      state.currentUserId = user.id;
      state.activeTab = 'dashboard';
      recordAuditLog('সাইন ইন', `${user.name} (${getRoleLabel(user.role)}) সিস্টেমে প্রবেশ করেছেন।`);

    function handleSignUp(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const name = String(fd.get('name') || '').trim();
      const mobile = normalizeMobile(fd.get('mobile'));
      const nid = String(fd.get('nid') || '').trim() || 'প্রযোজ্য নয়';

      const nominee = String(fd.get('nominee') || '').trim() || 'নমিনি নির্ধারিত নয়';
      const monthlyTarget = Math.max(100, Number(fd.get('monthlyTarget')) || 500);
      const initialShare = Math.max(0, Number(fd.get('initialShare')) || 0);
      const password = String(fd.get('password') || '');
      const roleChoice = fd.get('roleChoice') === 'ADMIN' ? 'ADMIN' : 'MEMBER';
      const designation = roleChoice === 'ADMIN'
        ? (String(fd.get('designation') || '').trim() || 'সহযোগী অ্যাডমিন')
        : 'সমবায় সদস্য';

      if (!name || mobile.length < 10 || !address || password.length < 6) {
        showToast('নাম, সঠিক মোবাইল নম্বর, ঠিকানা এবং কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।', 'error');
        return;
      }

      if (state.users.some(u => normalizeMobile(u.mobile) === mobile)) {
        showToast('এই মোবাইল নম্বরটি দিয়ে ইতিমধ্যে অ্যাকাউন্ট খোলা হয়েছে।', 'error');
        return;
      }

      const newUser = {
        id: 'USR-' + String(Date.now()).slice(-5),
        name,
        fatherOrHusband: String(fd.get('fatherOrHusband') || '').trim() || 'উল্লেখ নেই',
        motherName: '—',
        designation,
        mobile,
        password,
        nid,
        address,
        nominee,
        monthlyTarget,
        initialShare,
        role: roleChoice,
        joinedDate: getTodayISO(),
        active: true

      state.users.push(newUser);
      if (initialShare > 0) {
        syncLedgerTransaction({
          type: 'INCOME',
          category: 'প্রাথমিক শেয়ার/সঞ্চয়',

      state.activeTab = 'dashboard';

    }

      const existing = goalId ? state.goals.find(g => g.id === goalId) : null;
      const bodyHtml = `
        <form id="goalForm" onsubmit="saveGoalItem(event, '${existing ? existing.id : ''}')" class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">লক্ষ্য বা উদ্দেশ্যের শিরোনাম *</label>
            <input name="title" type="text" required value="${escapeHtml(existing?.title || '')}" placeholder="যেমন: সদস্যদের সঞ্চয় বৃদ্ধি ও আত্মকর্মসংস্থান"

          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">বিস্তারিত বিবরণ *</label>
            <textarea name="description" rows="4" required placeholder="বিস্তারিত লক্ষ্য বা উদ্দেশ্য লিখুন..."
              class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-somity-600 outline-none text-sm">${escapeHtml(existing?.description || '')}</textarea>
          </div>
        </form>
      `;

      openModal(existing ? 'লক্ষ্য / উদ্দেশ্য এডিট করুন' : 'নতুন লক্ষ্য / উদ্দেশ্য যোগ করুন', bodyHtml, [
        {
          label: 'বাতিল',
          className: 'px-4 py-2 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 text-sm font-semibold cursor-pointer',
          onClick: () => closeModal()
        },
        {
          label: 'সংরক্ষণ করুন',
          className: 'px-5 py-2 rounded-xl bg-somity-600 hover:bg-somity-700 text-white text-sm font-bold cursor-pointer',
          onClick: () => document.getElementById('goalForm')?.requestSubmit()
        }
      ]);
    }

    function saveGoalItem(e, goalId) {
      e.preventDefault();
      if (!isAdmin()) return;
      const fd = new FormData(e.target);
      const title = String(fd.get('title') || '').trim();
      const description = String(fd.get('description') || '').trim();
      if (!title || !description) {
        showToast('শিরোনাম ও বিবরণ উভয়ই পূরণ করুন।', 'error');
        return;
      }

      if (goalId) {
        const target = state.goals.find(g => g.id === goalId);
        if (target) {
          target.title = title;
          target.description = description;
          recordAuditLog('লক্ষ্য/উদ্দেশ্য এডিট', `"${title}" আপডেট করা হয়েছে।`);
        }
      } else {
        state.goals.push({
          id: 'GOAL-' + String(Date.now()).slice(-5),
          title,
          description
        });
        recordAuditLog('নতুন লক্ষ্য/উদ্দেশ্য যোগ', `"${title}" যুক্ত করা হয়েছে।`);
      }

      state.goalsMeta = {
        updatedAt: getTodayISO(),
        updatedBy: getCurrentUser()?.name || 'অ্যাডমিন'
      };
      saveState();
      closeModal();
      showToast('সমিতির লক্ষ্য ও উদ্দেশ্য সংরক্ষিত হয়েছে।', 'success');
      renderApp();
    }

    function moveGoal(goalId, delta) {
      if (!isAdmin()) return;
      const idx = state.goals.findIndex(g => g.id === goalId);
      if (idx === -1) return;
      const nextIdx = idx + delta;
      if (nextIdx < 0 || nextIdx >= state.goals.length) return;
      const temp = state.goals[idx];
      state.goals[idx] = state.goals[nextIdx];
      state.goals[nextIdx] = temp;
      state.goalsMeta = {
        updatedAt: getTodayISO(),
        updatedBy: getCurrentUser()?.name || 'অ্যাডমিন'
      };
      recordAuditLog('লক্ষ্য/উদ্দেশ্যের ক্রম পরিবর্তন', `"${temp.title}"-এর অবস্থান পরিবর্তন করা হয়েছে।`);
      saveState();
      renderApp();
    }

    function deleteGoal(goalId) {
      if (!isAdmin()) return;
      if (state.goals.length <= 1) {
        showToast('অন্তত একটি লক্ষ্য বা উদ্দেশ্য রাখা আবশ্যক।', 'warning');
        return;
      }
      const target = state.goals.find(g => g.id === goalId);
      state.goals = state.goals.filter(g => g.id !== goalId);
      state.goalsMeta = {
        updatedAt: getTodayISO(),
        updatedBy: getCurrentUser()?.name || 'অ্যাডমিন'
      };
      recordAuditLog('লক্ষ্য/উদ্দেশ্য মুছে ফেলা', `"${target?.title || goalId}" তালিকা থেকে বাদ দেওয়া হয়েছে।`);
      saveState();
      showToast('লক্ষ্য/উদ্দেশ্য মুছে ফেলা হয়েছে।', 'info');
      renderApp();
    }

                  </div>
                  <div class="w-full h-3 rounded-full bg-slate-100 overflow-hidden">

    function getPaymentChannelOptionsHtml(selectedVal = '') {
      const channels = (state.paymentChannels || []).filter(c => c.active !== false);
      if (!channels.length) {
        return `<option value="নগদ টাকা (অফিস কাউন্টার)">নগদ টাকা (অফিস কাউন্টার)</option>`;
      }
      return channels.map(ch => `
        <option value="${escapeHtml(ch.name)}" ${selectedVal === ch.name ? 'selected' : ''}>
          ${escapeHtml(ch.name)} (${escapeHtml(ch.number)})
        </option>
      `).join('');
    }

      const adminUser = isAdmin(user);
      const members = state.users.filter(u => u.active !== false);

        return true;

          </div>

            ${adminUser ? `
              <div class="lg:col-span-4 bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs h-fit">

                      ${getPaymentChannelOptionsHtml()}

                  <div class="grid grid-cols-2 gap-2.5">
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">TrxID / রেফারেন্স</label>

                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">জমার তারিখ *</label>

                <div class="flex items-center gap-2 flex-wrap">
                  <select onchange="uiFilter.savingsMonth = this.value; renderApp();" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs font-semibold">
                    <option value="ALL" ${uiFilter.savingsMonth === 'ALL' ? 'selected' : ''}>সব মাস</option>
                    ${monthsSet.map(m => `<option value="${m}" ${uiFilter.savingsMonth === m ? 'selected' : ''}>${formatMonthLabel(m)}</option>`).join('')}
                  </select>
                  ${adminUser ? `
                    <select onchange="uiFilter.savingsMember = this.value; renderApp();" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs font-semibold">
                      <option value="ALL" ${uiFilter.savingsMember === 'ALL' ? 'selected' : ''}>সব সদস্য</option>
                      ${state.users.map(u => `<option value="${u.id}" ${uiFilter.savingsMember === u.id ? 'selected' : ''}>${escapeHtml(u.name)}</option>`).join('')}

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-slate-200 text-xs font-bold text-slate-500">

    function onSavingsMemberChange(memberId) {
      const m = state.users.find(u => u.id === memberId);
      const amtInput = document.getElementById('savingsAmountInput');
      if (m && amtInput) {
        amtInput.value = Number(m.monthlyTarget) || 500;
      }
    }

    function handleCollectSavings(e) {
      e.preventDefault();
      if (!isAdmin()) {
        showToast('শুধুমাত্র অ্যাডমিন চাঁদা সংগ্রহ করতে পারেন।', 'error');
        return;
      }
      const fd = new FormData(e.target);
      const memberId = String(fd.get('memberId') || '');
      const member = state.users.find(u => u.id === memberId);
      const monthKey = String(fd.get('monthKey') || getCurrentMonthKey());
      const amount = Number(fd.get('amount')) || 0;
      const method = String(fd.get('method') || 'নগদ টাকা (অফিস কাউন্টার)');
      const reference = String(fd.get('reference') || '').trim();
      const date = String(fd.get('date') || getTodayISO());
      const note = String(fd.get('note') || '').trim() || 'মাসিক চাঁদা আদায়';

      if (!member || amount <= 0) {
        showToast('সদস্য এবং সঠিক টাকার পরিমাণ দিন।', 'error');
        return;
      }

      const actor = getCurrentUser();
      const seq = String(Date.now()).slice(-5);
      const record = {
        id: 'SAV-' + seq,
        receiptNo: 'RCP-SAV-' + seq,
        memberId: member.id,
        memberName: member.name,
        monthKey,
        amount,
        method,
        reference,
        date,
        collectedBy: actor?.name || 'অ্যাডমিন',
        note
      };

      state.savings.unshift(record);
      syncLedgerTransaction({
        type: 'INCOME',
        category: 'চাঁদা আদায়',
        title: `${member.name}-এর চাঁদা (${formatMonthLabel(monthKey)})`,
        amount,
        method,
        reference: reference || record.receiptNo,
        date,
        recordedBy: actor?.name || 'অ্যাডমিন'
      });

      recordAuditLog('চাঁদা আদায়', `${member.name}-এর ${formatBDT(amount)} (${formatMonthLabel(monthKey)}) চাঁদা আদায় করা হয়েছে।`);
      saveState();
      showToast(`${member.name}-এর ${formatBDT(amount)} চাঁদা জমা হয়েছে!`, 'success');
      renderApp();
      openSavingsReceiptModal(record.id);
    }

    function updateLoanPreview() {
      const p = Math.max(0, Number(document.getElementById('loanPrincipalInput')?.value) || 0);
      const r = Math.max(0, Number(document.getElementById('loanRateInput')?.value) || 0);
      const cnt = Math.max(1, Number(document.getElementById('loanInstallmentsInput')?.value) || 10);
      const total = Math.round(p + (p * r) / 100);
      const perInst = Math.ceil(total / cnt);
      const totalEl = document.getElementById('prevTotalPayable');
      const instEl = document.getElementById('prevPerInstallment');
      if (totalEl) totalEl.textContent = formatBDT(total);
      if (instEl) instEl.textContent = formatBDT(perInst);
    }

    function handleApplyLoan(e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const memberId = String(fd.get('memberId') || getCurrentUser()?.id || '');
      const member = state.users.find(u => u.id === memberId);
      const principal = Number(fd.get('principal')) || 0;
      const serviceChargeRate = Math.max(0, Number(fd.get('serviceChargeRate')) || 0);
      const installmentCount = Math.max(1, Number(fd.get('installmentCount')) || 10);
      const purpose = String(fd.get('purpose') || '').trim();
      const guarantorName = String(fd.get('guarantorName') || '').trim();
      const guarantorMobile = normalizeMobile(fd.get('guarantorMobile'));

      if (!member || principal < 1000 || !purpose || !guarantorName || guarantorMobile.length < 10) {
        showToast('আসল পরিমাণ (কমপক্ষে ৳১,০০০), উদ্দেশ্য এবং জামিনদারের সঠিক তথ্য দিন।', 'error');
        return;
      }

      const totalPayable = Math.round(principal + (principal * serviceChargeRate) / 100);
      const installmentAmount = Math.ceil(totalPayable / installmentCount);

      const newLoan = {
        id: 'LN-' + String(Date.now()).slice(-5),
        memberId: member.id,
        memberName: member.name,
        principal,
        serviceChargeRate,
        totalPayable,
        installmentCount,
        installmentAmount,
        paidInstallments: 0,
        paidAmount: 0,
        remainingAmount: totalPayable,
        nextDueDate: getTodayISO(),
        purpose,
        guarantorName,
        guarantorMobile,
        status: 'PENDING',
        appliedDate: getTodayISO(),
        reviewedBy: null,
        reviewedDate: null,
        reviewNote: ''
      };

      state.loans.unshift(newLoan);
      recordAuditLog('লোন আবেদন', `${member.name} ${formatBDT(principal)} লোনের আবেদন করেছেন (${newLoan.id})।`);
      saveState();
      showToast(`${member.name}-এর লোন আবেদন (${newLoan.id}) জমা হয়েছে।`, 'success');
      renderApp();

    function openLoanDecisionModal(loanId, decision) {
      if (!isAdmin()) {
        showToast('শুধুমাত্র অ্যাডমিন লোন Approval বা বাতিল করতে পারেন।', 'error');
        return;
      }
      const ln = state.loans.find(x => x.id === loanId);
      if (!ln) return;

      const isApprove = decision === 'APPROVED';
      const bodyHtml = `
        <form id="loanDecisionForm" onsubmit="submitLoanDecision(event, '${ln.id}', '${decision}')" class="space-y-3.5 text-sm">

            <p>আসল লোন: <strong>${formatBDT(ln.principal)}</strong> • মোট পরিশোধযোগ্য: <strong>${formatBDT(ln.totalPayable)}</strong></p>

          ${isApprove ? `
            <div>

              <select name="disburseMethod" class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm">

          </div>
        </form>
      `;

      openModal(isApprove ? `লোন Approval নিশ্চিত করুন — ${ln.id}` : `লোন আবেদন বাতিল করুন — ${ln.id}`, bodyHtml, [

          label: 'বাতিল',
          className: 'px-4 py-2 rounded-xl border border-slate-200 text-slate-700 text-sm font-semibold cursor-pointer',
          onClick: () => closeModal()
        },

          className: `px-5 py-2 rounded-xl text-white text-sm font-bold cursor-pointer ${isApprove ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-rose-600 hover:bg-rose-700'}`,
          onClick: () => document.getElementById('loanDecisionForm')?.requestSubmit()
        }
      ]);

    function submitLoanDecision(e, loanId, decision) {
      e.preventDefault();
      if (!isAdmin()) return;
      const ln = state.loans.find(x => x.id === loanId);
      if (!ln) return;

      const fd = new FormData(e.target);
      const actor = getCurrentUser();
      const reviewNote = String(fd.get('reviewNote') || '').trim();
      const disburseMethod = String(fd.get('disburseMethod') || 'নগদ টাকা (অফিস কাউন্টার)');

      ln.status = decision;
      ln.reviewedBy = actor?.name || 'অ্যাডমিন';
      ln.reviewedDate = getTodayISO();
      ln.reviewNote = reviewNote || (decision === 'APPROVED' ? 'অ্যাডমিন কর্তৃক অনুমোদিত' : 'অ্যাডমিন কর্তৃক বাতিলকৃত');

      if (decision === 'APPROVED') {
        syncLedgerTransaction({
          type: 'EXPENSE',
          category: 'লোন বিতরণ',
          title: `${ln.memberName}-কে লোন প্রদান (${ln.id})`,
          amount: ln.principal,
          method: disburseMethod,
          reference: ln.id,
          date: getTodayISO(),
          recordedBy: actor?.name || 'অ্যাডমিন'
        });
        recordAuditLog('লোন Approval', `${ln.memberName}-এর ${formatBDT(ln.principal)} লোন (${ln.id}) অনুমোদিত হয়েছে।`);
        showToast(`${ln.memberName}-এর লোন (${ln.id}) অনুমোদিত হয়েছে!`, 'success');
      } else {
        recordAuditLog('লোন বাতিল', `${ln.memberName}-এর লোন আবেদন (${ln.id}) বাতিল করা হয়েছে।`);
        showToast(`লোন আবেদন (${ln.id}) বাতিল করা হয়েছে।`, 'warning');
      }

      saveState();
      closeModal();
      renderApp();
    }

    function onInstallmentLoanChange(loanId) {
      const ln = state.loans.find(l => l.id === loanId);
      const amtEl = document.getElementById('installmentAmountInput');
      const feeEl = document.getElementById('installmentLateFeeInput');
      if (ln && amtEl) {
        amtEl.value = Math.min(Number(ln.installmentAmount) || 0, Number(ln.remainingAmount) || 0);
      }
      if (ln && feeEl) {
        feeEl.value = calculateSuggestedLateFee(ln.nextDueDate);
      }
    }

    function handlePayInstallment(e) {
      e.preventDefault();
      if (!isAdmin()) {
        showToast('শুধুমাত্র অ্যাডমিন কিস্তি আদায় করতে পারেন।', 'error');
        return;
      }
      const fd = new FormData(e.target);
      const loanId = String(fd.get('loanId') || '');
      const ln = state.loans.find(l => l.id === loanId && l.status === 'APPROVED');
      const amount = Math.max(0, Number(fd.get('amount')) || 0);
      const lateFee = Math.max(0, Number(fd.get('lateFee')) || 0);
      const method = String(fd.get('method') || 'নগদ টাকা (অফিস কাউন্টার)');
      const reference = String(fd.get('reference') || '').trim();
      const date = String(fd.get('date') || getTodayISO());

      if (!ln || amount <= 0) {
        showToast('সক্রিয় লোন এবং কিস্তির পরিমাণ দিন।', 'error');
        return;
      }

      const appliedPrincipalPay = Math.min(amount, Number(ln.remainingAmount) || 0);
      ln.paidAmount = (Number(ln.paidAmount) || 0) + appliedPrincipalPay;
      ln.remainingAmount = Math.max(0, (Number(ln.totalPayable) || 0) - ln.paidAmount);
      ln.paidInstallments = Math.min(Number(ln.installmentCount) || 1, (Number(ln.paidInstallments) || 0) + 1);

      if (ln.remainingAmount <= 0) {
        ln.status = 'COMPLETED';
      }

      const actor = getCurrentUser();
      const seq = String(Date.now()).slice(-5);
      const totalPaid = appliedPrincipalPay + lateFee;

      const insRecord = {
        id: 'INS-' + seq,
        receiptNo: 'RCP-INS-' + seq,
        loanId: ln.id,
        memberId: ln.memberId,
        memberName: ln.memberName,
        installmentNo: ln.paidInstallments,
        amount: appliedPrincipalPay,
        lateFee,
        totalPaid,
        method,
        reference,
        date,
        receivedBy: actor?.name || 'অ্যাডমিন'
      };

      state.installments.unshift(insRecord);

      syncLedgerTransaction({
        type: 'INCOME',
        category: 'কিস্তি ও সার্ভিস চার্জ',
        title: `${ln.memberName}-এর লোন কিস্তি (${ln.id})`,
        amount: appliedPrincipalPay,
        method,
        reference: reference || insRecord.receiptNo,
        date,
        recordedBy: actor?.name || 'অ্যাডমিন'
      });

      if (lateFee > 0) {
        syncLedgerTransaction({
          type: 'INCOME',
          category: 'বিলম্ব জরিমানা',
          title: `${ln.memberName}-এর কিস্তি বিলম্ব ফি (${ln.id})`,
          amount: lateFee,
          method,
          reference: reference || insRecord.receiptNo,
          date,
          recordedBy: actor?.name || 'অ্যাডমিন'
        });
      }

      recordAuditLog('কিস্তি পরিশোধ', `${ln.memberName}-এর ${ln.id} লোনের ${formatBDT(totalPaid)} কিস্তি পরিশোধিত হয়েছে।`);
      saveState();
      showToast(`${ln.memberName}-এর ${formatBDT(totalPaid)} কিস্তি জমা হয়েছে!`, 'success');
      renderApp();
      openInstallmentReceiptModal(insRecord.id);
    }

    // =========================================================================

    function renderPaymentsView(user) {
      const adminUser = isAdmin(user);

      return `

    function openEditPaymentChannelsModal() {
      if (!isAdmin()) return;
      const channels = state.paymentChannels || [];
      const bodyHtml = `
        <form id="paymentChannelsForm" onsubmit="savePaymentChannels(event)" class="space-y-3 text-xs">
          ${channels.map((ch, i) => `
            <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-2">
              <div class="flex items-center justify-between">
                <strong class="text-sm text-slate-900">${escapeHtml(ch.name)}</strong>
                <label class="inline-flex items-center gap-1.5 font-bold text-slate-700 cursor-pointer">
                  <input type="checkbox" name="active_${i}" ${ch.active !== false ? 'checked' : ''} class="rounded text-somity-600" />
                  সক্রিয়
                </label>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <input name="number_${i}" type="text" required value="${escapeHtml(ch.number)}" placeholder="নম্বর বা হিসাব নং" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm" />
                <input name="type_${i}" type="text" value="${escapeHtml(ch.accountType || '')}" placeholder="অ্যাকাউন্টের ধরন" class="px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm" />
              </div>
              <input name="note_${i}" type="text" value="${escapeHtml(ch.note || '')}" placeholder="নির্দেশনা বা নোট" class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-xs" />
            </div>
          `).join('')}
        </form>
      `;

      openModal('পেমেন্ট চ্যানেল নম্বর ও তথ্য এডিট', bodyHtml, [
        {
          label: 'বাতিল',
          className: 'px-4 py-2 rounded-xl border border-slate-200 text-slate-700 text-sm font-semibold cursor-pointer',
          onClick: () => closeModal()
        },
        {
          label: 'সংরক্ষণ করুন',
          className: 'px-5 py-2 rounded-xl bg-somity-600 hover:bg-somity-700 text-white text-sm font-bold cursor-pointer',
          onClick: () => document.getElementById('paymentChannelsForm')?.requestSubmit()
        }
      ]);

    function savePaymentChannels(e) {
      e.preventDefault();
      if (!isAdmin()) return;
      const fd = new FormData(e.target);
      state.paymentChannels = state.paymentChannels.map((ch, i) => ({
        ...ch,
        number: String(fd.get(`number_${i}`) || ch.number).trim(),
        accountType: String(fd.get(`type_${i}`) || ch.accountType || '').trim(),
        note: String(fd.get(`note_${i}`) || ch.note || '').trim(),
        active: fd.get(`active_${i}`) === 'on'
      }));
      recordAuditLog('পেমেন্ট চ্যানেল আপডেট', 'বিকাশ/নগদ/রকেট/ব্যাংক/ক্যাশ পেমেন্ট তথ্য হালনাগাদ করা হয়েছে।');
      saveState();
      closeModal();
      showToast('পেমেন্ট চ্যানেলের তথ্য আপডেট হয়েছে।', 'success');
      renderApp();
    }

                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">বিবরণ *</label>

                  <div class="grid grid-cols-2 gap-2.5">
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">টাকার পরিমাণ (৳) *</label>
                      <input name="amount" type="number" min="1" step="1" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm font-bold" />
                    </div>
                    <div>
                      <label class="block text-xs font-bold text-slate-700 mb-1">তারিখ *</label>
                      <input name="date" type="date" value="${getTodayISO()}" required class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />

                  <div>

                    <select name="method" class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-white text-sm">
                      ${getPaymentChannelOptionsHtml()}

                  </div>

                  <button type="submit" class="w-full py-2.5 rounded-xl bg-somity-600 hover:bg-somity-700 text-white text-sm font-bold shadow-sm cursor-pointer transition">

            <div class="${adminUser ? 'lg:col-span-8' : 'lg:col-span-12'} bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs">
              <div class="flex items-center justify-between gap-2 mb-4 flex-wrap">
                <h3 class="text-base font-bold text-slate-900">আয়-ব্যয়ের খাতা (${toBengaliDigits(filteredTxns.length)}টি এন্ট্রি)</h3>
                <select onchange="uiFilter.ledgerType = this.value; renderApp();" class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white text-xs font-bold">
                  <option value="ALL" ${uiFilter.ledgerType === 'ALL' ? 'selected' : ''}>সব এন্ট্রি</option>
                  <option value="INCOME" ${uiFilter.ledgerType === 'INCOME' ? 'selected' : ''}>শুধু আয়</option>
                  <option value="EXPENSE" ${uiFilter.ledgerType === 'EXPENSE' ? 'selected' : ''}>শুধু ব্যয়</option>

                      return `

                </table>

        </div>
      `;

    function handleAddTransaction(e) {
      e.preventDefault();
      if (!isAdmin()) {
        showToast('শুধুমাত্র অ্যাডমিন আয় বা ব্যয় এন্ট্রি করতে পারেন।', 'error');
        return;
      }
      const fd = new FormData(e.target);
      const type = fd.get('type') === 'EXPENSE' ? 'EXPENSE' : 'INCOME';
      const category = String(fd.get('category') || '').trim();
      const title = String(fd.get('title') || '').trim();
      const amount = Number(fd.get('amount')) || 0;
      const date = String(fd.get('date') || getTodayISO());
      const method = String(fd.get('method') || 'নগদ টাকা (অফিস কাউন্টার)');

      if (!category || !title || amount <= 0) {
        showToast('খাত, বিবরণ এবং সঠিক টাকার পরিমাণ দিন।', 'error');
        return;
      }

      const actor = getCurrentUser();
      syncLedgerTransaction({
        type,
        category,
        title,
        amount,
        method,
        reference: 'MANUAL',
        date,
        recordedBy: actor?.name || 'অ্যাডমিন'
      });

      recordAuditLog(type === 'INCOME' ? 'নতুন আয় এন্ট্রি' : 'নতুন ব্যয় এন্ট্রি', `${category} — ${title} (${formatBDT(amount)})।`);
      saveState();
      showToast(`${type === 'INCOME' ? 'আয়' : 'ব্যয়'} খাতায় সংরক্ষিত হয়েছে।`, 'success');
      renderApp();
    }

    // =========================================================================

      const adminUser = isAdmin(user);
      const query = uiFilter.memberSearch.trim().toLowerCase();

      const membersList = state.users.filter(u => {
        if (!query) return true;
        return (
          String(u.name || '').toLowerCase().includes(query) ||
          String(u.mobile || '').toLowerCase().includes(query) ||
          String(u.address || '').toLowerCase().includes(query) ||
          String(u.nid || '').toLowerCase().includes(query)
        );
      });

      return `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">

              <h2 class="text-xl font-bold text-slate-900">👥 সদস্য ডিরেক্টরি ও তথ্য ব্যবস্থাপনা</h2>
              <p class="text-xs sm:text-sm text-slate-500">সকল সদস্যের সঞ্চয়, লোন বকেয়া, পাসবুক এবং অ্যাডমিন কর্তৃক সদস্য তথ্য সম্পাদনা।</p>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-200 text-xs font-bold text-slate-500">
                    <th class="py-2.5 pr-3">সদস্য ও পদবি</th>
                    <th class="py-2.5 px-3">মোবাইল ও ঠিকানা</th>
                    <th class="py-2.5 px-3 text-right">মোট সঞ্চয়</th>
                    <th class="py-2.5 px-3 text-right">লোন বকেয়া</th>
                    <th class="py-2.5 pl-3 text-right">পাসবুক ও এডিট</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-sm">
                  ${membersList.map(m => {
                    const sav = getMemberSavingsTotal(m.id);
                    const ln = getMemberLoanSummary(m.id);
                    const canEdit = canEditUserRecord(m);

                      <tr class="hover:bg-slate-50/80 ${m.active === false ? 'opacity-65' : ''}">

    function handleAddAdmin(e) {
      e.preventDefault();
      if (!isAdmin()) {
        showToast('শুধুমাত্র অ্যাডমিন নতুন অ্যাডমিন যুক্ত করতে পারেন।', 'error');
        return;
      }
      const fd = new FormData(e.target);
      const name = String(fd.get('name') || '').trim();
      const mobile = normalizeMobile(fd.get('mobile'));
      const password = String(fd.get('password') || '');
      const designation = String(fd.get('designation') || '').trim() || 'কার্যনির্বাহী অ্যাডমিন';
      const address = String(fd.get('address') || '').trim() || 'খিলমুরারী, সদর';

      if (!name || mobile.length < 10 || password.length < 6) {
        showToast('নাম, সঠিক মোবাইল নম্বর এবং কমপক্ষে ৬ অক্ষরের পাসওয়ার্ড দিন।', 'error');
        return;
      }

      if (state.users.some(u => normalizeMobile(u.mobile) === mobile)) {
        showToast('এই মোবাইল নম্বর দিয়ে আগে থেকেই অ্যাকাউন্ট রয়েছে।', 'error');
        return;
      }

      const newAdmin = {
        id: 'USR-' + String(Date.now()).slice(-5),
        name,
        fatherOrHusband: 'উল্লেখ নেই',
        motherName: '—',
        designation,
        mobile,
        password,
        nid: 'অ্যাডমিন অনুমোদিত',
        address,
        nominee: 'সমিতি মনোনীত',
        monthlyTarget: 1000,
        initialShare: 0,
        role: 'ADMIN',
        joinedDate: getTodayISO(),
        active: true
      };

      state.users.push(newAdmin);
      recordAuditLog('নতুন অ্যাডমিন যোগ', `${getCurrentUser()?.name || 'অ্যাডমিন'} নতুন অ্যাডমিন "${name}" (${designation}) যুক্ত করেছেন।`);
      saveState();
      showToast(`নতুন অ্যাডমিন "${name}" যুক্ত করা হয়েছে!`, 'success');
      renderApp();
    }

    function demoteAdminToMember(adminId) {
      if (!isMainAdmin()) {
        showToast('শুধুমাত্র প্রধান অ্যাডমিন রোল পরিবর্তন করতে পারেন।', 'error');
        return;
      }
      const target = state.users.find(u => u.id === adminId);
      if (!target || target.role === 'MAIN_ADMIN') return;
      target.role = 'MEMBER';
      target.designation = 'সমবায় সদস্য';
      recordAuditLog('অ্যাডমিন রোল পরিবর্তন', `${target.name}-কে সাধারণ সদস্য পদে স্থানান্তর করা হয়েছে।`);
      saveState();
      showToast(`${target.name}-কে সদস্য পদে স্থানান্তর করা হয়েছে।`, 'info');
      renderApp();
    }

    function canEditUserRecord(target) {
      const actor = getCurrentUser();
      if (!actor || !target) return false;
      if (actor.role === 'MAIN_ADMIN') return true;
      if (actor.role === 'ADMIN') {
        return target.role === 'MEMBER' || target.id === actor.id;
      }
      return false;
    }

      if (!target || !canEditUserRecord(target)) {

      const isMain = actor?.role === 'MAIN_ADMIN';
      const isTargetMain = target.role === 'MAIN_ADMIN';

      const bodyHtml = `

          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="block font-bold text-slate-700 mb-1">নমিনি</label>

              <label class="block font-bold text-slate-700 mb-1">মাসিক চাঁদা লক্ষ্য (৳)</label>

    function saveEditedUserRecord(e, targetId) {
      e.preventDefault();
      const target = state.users.find(u => u.id === targetId);
      if (!target || !canEditUserRecord(target)) return;

      const fd = new FormData(e.target);
      const name = String(fd.get('name') || '').trim();
      const mobile = normalizeMobile(fd.get('mobile'));
      const address = String(fd.get('address') || '').trim();
      const password = String(fd.get('password') || '');

      if (!name || mobile.length < 10 || !address || password.length < 6) {
        showToast('নাম, সঠিক মোবাইল নম্বর, ঠিকানা ও ৬+ অক্ষরের পাসওয়ার্ড দিন।', 'error');
        return;
      }

      if (state.users.some(u => u.id !== target.id && normalizeMobile(u.mobile) === mobile)) {
        showToast('এই মোবাইল নম্বরটি অন্য একজনের অ্যাকাউন্টে রয়েছে।', 'error');
        return;
      }

      target.name = name;
      target.mobile = mobile;
      target.nid = String(fd.get('nid') || '').trim() || 'প্রযোজ্য নয়';
      target.designation = String(fd.get('designation') || '').trim() || getRoleLabel(target.role);
      target.address = address;
      target.nominee = String(fd.get('nominee') || '').trim() || 'নমিনি নির্ধারিত নয়';
      target.monthlyTarget = Math.max(0, Number(fd.get('monthlyTarget')) || 500);
      target.initialShare = Math.max(0, Number(fd.get('initialShare')) || 0);
      target.password = password;

      if (target.role !== 'MAIN_ADMIN') {
        target.active = fd.get('active') === 'on';
        if (isMainAdmin()) {
          const nextRole = fd.get('role');
          if (nextRole === 'ADMIN' || nextRole === 'MEMBER') {
            target.role = nextRole;
          }
        }
      }

    function handleAddNotice(e) {
      e.preventDefault();
      if (!isAdmin()) return;
      const fd = new FormData(e.target);
      const title = String(fd.get('title') || '').trim();
      const body = String(fd.get('body') || '').trim();
      const pinned = fd.get('pinned') === 'on';
      if (!title || !body) return;

      state.notices.unshift({
        id: 'NTC-' + String(Date.now()).slice(-5),
        title,
        body,
        date: getTodayISO(),
        author: getCurrentUser()?.name || 'অ্যাডমিন',
        pinned
      });
      recordAuditLog('নতুন নোটিশ প্রকাশ', `"${title}" নোটিশ প্রকাশ করা হয়েছে।`);
      saveState();
      showToast('নতুন নোটিশ প্রকাশিত হয়েছে।', 'success');
      renderApp();
    }

    function deleteNotice(id) {
      if (!isAdmin()) return;
      state.notices = state.notices.filter(n => n.id !== id);
      saveState();
      showToast('নোটিশ মুছে ফেলা হয়েছে।', 'info');
      renderApp();
    }

              <p class="text-xs text-slate-600">সদস্য, অ্যাডমিন, লক্ষ্য-উদ্দেশ্য, চাঁদা, লোন, কিস্তি ও আয়-ব্যয়ের সম্পূর্ণ ডাটা ফাইল হিসেবে নামিয়ে রাখুন।</p>

              <input type="file" accept=".json,application/json" onchange="handleRestoreJsonBackup(event)" class="block w-full text-xs text-slate-700 file:mr-3 file:py-2 file:px-3.5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-100 file:text-amber-950 hover:file:bg-amber-200 cursor-pointer" />

    function downloadJsonBackup() {
      try {
        const jsonStr = JSON.stringify(state, null, 2);
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `khilmurari-somobay-backup-${getTodayISO()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        recordAuditLog('ব্যাকআপ ডাউনলোড', 'সম্পূর্ণ JSON ব্যাকআপ ফাইল ডাউনলোড করা হয়েছে।');
        saveState();
        showToast('ব্যাকআপ ফাইল ডাউনলোড হয়েছে!', 'success');
      } catch (err) {
        showToast('ব্যাকআপ তৈরি করতে সমস্যা হয়েছে।', 'error');
      }
    }

    function handleRestoreJsonBackup(e) {
      const file = e.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        try {
          const parsed = JSON.parse(String(ev.target?.result || '{}'));
          state = migrateState(parsed);
          recordAuditLog('ব্যাকআপ রিস্টোর', 'JSON ব্যাকআপ ফাইল থেকে ডাটা রিস্টোর করা হয়েছে।');
          saveState();
          showToast('ব্যাকআপ ডাটা সফলভাবে রিস্টোর হয়েছে!', 'success');
          renderApp();
        } catch (err) {
          showToast('সঠিক JSON ব্যাকআপ ফাইল নির্বাচন করুন।', 'error');
        }
      };
      reader.readAsText(file);
    }

    function triggerCsvDownload(filename, rows) {
      const csvContent = rows
        .map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','))
        .join('\n');
      const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast(`${filename} ডাউনলোড হয়েছে!`, 'success');
    }

        ...state.savings.map(s => [s.receiptNo || s.id, s.memberName, s.monthKey, s.amount, s.method, s.reference || '', s.date, s.collectedBy || ''])
      ];
      triggerCsvDownload(`somity-savings-${getTodayISO()}.csv`, rows);

      `;
    }

    function renderApp() {
      const appEl = document.getElementById('app');
      if (!appEl) return;
      try {
        const currentUser = getCurrentUser();
        if (!currentUser) {
          appEl.innerHTML = renderAuthScreen();
        } else {
          appEl.innerHTML = renderAuthenticatedShell(currentUser);
        }
      } catch (err) {
        console.error('Render error:', err);
        appEl.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4">
            <div class="max-w-md w-full bg-white rounded-2xl p-6 border border-rose-200 shadow-lg text-center space-y-3">
              <h2 class="text-lg font-bold text-rose-700">রেন্ডারিং সমস্যা দেখা দিয়েছে</h2>
              <p class="text-xs text-slate-600">${escapeHtml(err.message || 'অজানা ত্রুটি')}</p>
              <button type="button" onclick="location.reload()" class="px-4 py-2 rounded-xl bg-somity-600 text-white text-xs font-bold cursor-pointer">
                পুনরায় লোড করুন
              </button>
            </div>
          </div>
        `;
      }
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    window.addEventListener('DOMContentLoaded', function () {
      renderApp();
    });
  </script>
</body>
</html>
